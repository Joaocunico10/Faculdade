<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Testes Flexbox</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Laboratório de Testes - Flexbox</h1>

<!-- FLEX DIRECTION -->
<section>
    <h2>Flex Direction</h2>
    <div class="container direction">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</section>


<!-- JUSTIFY CONTENT -->
<section>
    <h2>Justify Content</h2>
    <div class="container justify">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</section>


<!-- ALIGN ITEMS -->
<section>
    <h2>Align Items</h2>
    <div class="container align">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</section>


<!-- FLEX WRAP -->
<section>
    <h2>Flex Wrap</h2>
    <div class="container wrap">
        <div class="box large">1</div>
        <div class="box large">2</div>
        <div class="box large">3</div>
        <div class="box large">4</div>
        <div class="box large">5</div>
    </div>
</section>


<!-- FLEX GROW SHRINK BASIS -->
<section>
    <h2>Flex Grow / Shrink / Basis</h2>
    <div class="container grow">
        <div class="box grow1">1</div> <!-- grow -->
        <div class="box grow1">2</div>
        <div class="box grow2">3</div>
        <div class="box grow3">4</div>
        <div class="box grow2">5</div>
    </div>
</section>

</body>
</html>
