<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aqui voce vai ver o melhor FLEXBOX ja visto antes!!</h1>

    <section>
        <h2>Justify content</h2>
        <div class="container justify">
            <div class="box">Neymar</div>
            <div class="box">Vini Jr</div>
            <div class="box">Raphinha</div>
        </div>
    </section>

    <section>
        <h2>Flex</h2>
        <div class="flex direction">
            <div class="box2">Brasil</div>
            <div class="box2">Franca</div>
            <div class="box2">Espanha</div>
            <div class="box2">Inglaterra</div>
            <div class="box2">Portugal</div>
            <div class="box2">Argentina</div>
        </div>
    </section>

</body>
</html>
